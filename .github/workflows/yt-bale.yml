name: Taha Downloader Bot

on:
  workflow_dispatch:
    inputs:
      YT_URL:
        description: 'Media URL'
        required: true
        type: string
      PLATFORM:
        description: 'Target Platform'
        required: true
        default: 'youtube'
        type: choice
        options:
          - 'youtube'
          - 'instagram'
          - 'tiktok'
          - 'twitter'
          - 'reddit'
          - 'other'
      CHAT_ID:
        description: 'Bale Chat ID'
        required: true
        type: string
      YT_QUALITY:
        description: 'Target Quality'
        required: false
        default: '1080p'
        type: choice
        options:
          - '8K'
          - '4K'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
          - '240p'
      YT_FORMAT:
        description: 'Format'
        required: false
        default: 'mp4'
        type: choice
        options:
          - 'mp4'
          - 'mp3'
      GET_SUBS:
        description: 'Embed Subtitles'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      JOB_ID:
        description: 'Internal job id (set by the bot, used for status callbacks)'
        required: false
        default: ''

jobs:
  download_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 curl-cffi https://github.com/yt-dlp/yt-dlp/archive/master.zip

      - name: Create cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi

      - name: Run Bot Script
        env:
          YT_URL: ${{ github.event.inputs.YT_URL }}
          PLATFORM: ${{ github.event.inputs.PLATFORM }}
          YT_FORMAT: ${{ github.event.inputs.YT_FORMAT }}
          YT_QUALITY: ${{ github.event.inputs.YT_QUALITY }}
          CHAT_ID: ${{ github.event.inputs.CHAT_ID }}
          GET_SUBS: ${{ github.event.inputs.GET_SUBS }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python main.py

      - name: Report result to bot
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          JOB_ID: ${{ github.event.inputs.JOB_ID }}
          CHAT_ID: ${{ github.event.inputs.CHAT_ID }}
          STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$CALLBACK_URL" ] || [ -z "$JOB_ID" ]; then
            echo "No callback configured/no job id — skipping notify step."
            exit 0
          fi
          curl -s -X POST "$CALLBACK_URL/callback/$CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg job_id "$JOB_ID" --arg chat_id "$CHAT_ID" --arg status "$STATUS" --arg run_url "$RUN_URL" \
                  '{job_id:$job_id, chat_id:$chat_id, status:$status, run_url:$run_url}')" \
            || echo "Callback POST failed (non-fatal)."
