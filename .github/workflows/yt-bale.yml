name: Taha Downloader Bot

on:
  workflow_dispatch:
    inputs:
      YT_URL:
        description: 'Media URL'
        required: true
        type: string
      PLATFORM:
        description: 'Target Platform'
        required: true
        type: string
      CHAT_ID:
        description: 'Bale Chat ID'
        required: true
        type: string
      YT_QUALITY:
        description: 'Target Quality'
        required: false
        type: string
      YT_FORMAT:
        description: 'Format'
        required: false
        type: string
      GET_SUBS:
        description: 'Embed Subtitles'
        required: false
        type: string
      GET_COMMENTS:
        description: 'Download Comments'
        required: false
        type: string
      GET_DESC:
        description: 'Download Description'
        required: false
        type: string
      GET_THUMBNAIL:
        description: 'Download Thumbnail'
        required: false
        type: string

jobs:
  download_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 curl-cffi https://github.com/yt-dlp/yt-dlp/archive/master.zip

      - name: Create cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi

      - name: Run Bot Script
        env:
          YT_URL: ${{ github.event.inputs.YT_URL }}
          PLATFORM: ${{ github.event.inputs.PLATFORM }}
          YT_FORMAT: ${{ github.event.inputs.YT_FORMAT }}
          YT_QUALITY: ${{ github.event.inputs.YT_QUALITY }}
          CHAT_ID: ${{ github.event.inputs.CHAT_ID }}
          GET_SUBS: ${{ github.event.inputs.GET_SUBS }}
          GET_COMMENTS: ${{ github.event.inputs.GET_COMMENTS }}
          GET_DESC: ${{ github.event.inputs.GET_DESC }}
          GET_THUMBNAIL: ${{ github.event.inputs.GET_THUMBNAIL }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python main.py
